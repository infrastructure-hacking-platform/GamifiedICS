  guacd_Laptop:
    image: guacamole/guacd
    container_name: guacd_Laptop

  guac_mysql_Laptop:
    image: mysql
    container_name: guac_mysql_Laptop
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: guac_db_Laptop
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - guac_mysql_data_Laptop:/var/lib/mysql
      - ./init/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro

  guacamole_Laptop:
    image: guacamole/guacamole
    container_name: guacamole_Laptop
    depends_on:
      - guacd_Laptop
      - guac_mysql_Laptop
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOSTNAME: guac_mysql_Laptop
      MYSQL_DATABASE: guac_db_Laptop
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      GUACD_HOSTNAME: guacd_Laptop
      GUACD_PORT: 4822

  Laptop:
    image: rastasheep/ubuntu-sshd
    container_name: Laptop
    command: >
      bash -c "id -u user &>dev/null || useradd -s /bin/bash user &&
               echo "user:password" | chpasswd &&
               chmod 755 /home/user &&
               usermod -aG sudo user &&
               apt update &&
               apt install sudo &&
               apt install -y net-tools &&
               apt install -y iputils-ping &&
               apt install -y iptables &&
               apt install -y nmap &&
               /home/user/install_mbpoll.sh &&
               /usr/sbin/sshd -D"
    volumes:
      - Laptop_data:/home/user
      - /home/kali/Desktop/GamifiedICS/scripts/install_mbpoll.sh:/home/user/install_mbpoll.sh
    depends_on:
      - guacd_Laptop
      - guac_mysql_Laptop
      - guacamole_Laptop










