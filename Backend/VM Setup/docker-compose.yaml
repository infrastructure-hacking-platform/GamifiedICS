services:
  Inverter_EV-charger:
    image: openplc-docker
    container_name: Inverter_EV-charger
    ports:
      - "8010:8080"
      - "510:502"
    command: >
      bash -c "/home/openplc/scripts/run.sh"
    volumes:
      - /home/kali/Desktop/GamifiedICS/init/OpenPLC/EV-charger/Inverter/openplc:/home/openplc
    networks:
      network_EV-charger:
        ipv4_address: 192.168.100.10

  Communications_EV-charger:
    image: openplc-docker
    container_name: Communications_EV-charger
    user: root
    ports:
      - "8011:8080"
      - "511:502"
    cap_add:
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
    command: >
      bash -c "apt update &&
               apt install -y net-tools &&
               apt install -y iputils-ping &&
               apt install -y iptables &&
               apt install -y nmap &&
               /home/openplc/scripts/run.sh"
    volumes:
      - /home/kali/Desktop/GamifiedICS/init/OpenPLC/EV-charger/Communications/openplc:/home/openplc
    networks:
      network_EV-charger:
        ipv4_address: 192.168.100.11
        
        
 
  
  





